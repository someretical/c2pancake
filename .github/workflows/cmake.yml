name: CMake on multiple platforms

on:
  push:
    branches: ["master", "libtooling"]
  pull_request:
    branches: ["master", "libtooling"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-24.04]
        include:
          - os: ubuntu-24.04
            c_compiler: clang-18
            cpp_compiler: clang++-18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install libedit-dev zlib1g-dev libzstd-dev libcurl4-openssl-dev -y
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22.1.7 all
          sudo apt install software-properties-common -y
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install gcc-16 g++-16 libstdc++-16-dev -y
          sudo apt install software-properties-common -y
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install gcc-16 g++-16 libstdc++-16-dev -y
          sudo apt install build-essential ninja-build cmake cmake-format -y

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        # The reason we use $$GITHUB_WORKSPACE instead of ${{ github.workspace }} is because on windows, the latter returns a path containing backslashes which is bad
        run: |
          echo "build-output-dir=$GITHUB_WORKSPACE/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake 
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE 
          -DCMAKE_C_COMPILER:FILEPATH=/usr/bin/clang-22 
          -DCMAKE_CXX_COMPILER:FILEPATH=/usr/bin/clang++-22 
          --no-warn-unused-cli 
          -S ${{ github.workspace }} 
          -B ${{ steps.strings.outputs.build-output-dir }}
          -G "Ninja Multi-Config"

      - name: Build Release
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release --target all --

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: ${{ steps.strings.outputs.build-output-dir }}/Release
